name: Deploy Billions Agent

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install All Dependencies & Run
        run: |
          # Устанавливаем полный стек iden3 и необходимые утилиты
          npm install @0xpolygonid/js-sdk @iden3/js-iden3-auth @iden3/js-jwz ethers dotenv
          
          # Установка скилла
          npx clawhub@latest install verified-agent-identity --force
          
          # 1. Генерация ключей (уже должна пройти успешно)
          node scripts/createNewEthereumIdentity.js
          
          # 2. Привязка агента (тут была ошибка, теперь модули на месте)
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Dev_Agent_Project", "description": "AI Agent for automated services"}'
