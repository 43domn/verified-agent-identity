name: Deploy Billions Agent

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run
        run: |
          # 1. Устанавливаем необходимые SDK вручную
          npm install @0xpolygonid/js-sdk ethers dotenv
          
          # 2. Установка скилла через clawhub
          npx clawhub@latest install verified-agent-identity --force
          
          # 3. Генерация ключей
          node scripts/createNewEthereumIdentity.js
          
          # 4. Привязка агента
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Dev_Agent_Project", "description": "AI Agent for automated services"}'
